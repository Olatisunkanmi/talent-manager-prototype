<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talent Manager Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:oklch(0.972 0.004 255);
  --surface:oklch(1 0 0);
  --surface-sunken:oklch(0.985 0.003 255);
  --line:oklch(0.92 0.006 255);
  --ink:oklch(0.21 0.02 260);
  --ink-muted:oklch(0.52 0.015 260);
  --primary:oklch(0.55 0.21 262);
  --primary-soft:oklch(0.955 0.03 262);
  --income:oklch(0.62 0.15 160);
  --owed:oklch(0.60 0.16 40);
  --recoverable:oklch(0.78 0.14 80);

  --font-ui:'Figtree',ui-sans-serif,'Helvetica Neue',sans-serif;
  --font-mono:'Geist Mono',ui-monospace,Menlo,monospace;
  --t-xs:12px;--t-sm:14px;--t-base:15px;--t-lg:18px;--t-xl:22px;--t-2xl:28px;--t-3xl:36px;

  --s-1:4px;--s-2:8px;--s-3:16px;--s-4:32px;--s-5:48px;--s-6:64px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;

  --sh-card:0 1px 2px oklch(0.21 0.02 260 / 0.04);
  --sh-paper:0 8px 24px oklch(0.21 0.02 260 / 0.08);
  --sh-pop:0 8px 24px oklch(0.21 0.02 260 / 0.10);
  --ease:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font-ui);font-size:var(--t-base);color:var(--ink);background:var(--canvas);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.mono{font-family:var(--font-mono);font-size:var(--t-sm)}
.label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}

/* shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;gap:var(--s-3);padding:var(--s-3)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:var(--s-3);display:flex;flex-direction:column;gap:var(--s-3);position:sticky;top:var(--s-3);height:calc(100vh - 32px)}
.ws{display:flex;align-items:center;gap:12px;padding:var(--s-2)}
.logo{width:36px;height:36px;border-radius:var(--r-md);background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
.ws b{display:block;font-weight:600}.ws span{font-size:var(--t-xs);color:var(--ink-muted)}
.switch{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--surface-sunken);transition:border-color .15s var(--ease)}
.switch:hover{border-color:var(--primary)}
.av{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:var(--t-xs);flex:none}
.switch small{display:block;color:var(--ink-muted);font-size:var(--t-xs)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .label{padding:var(--s-2) 12px}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:var(--r-md);color:var(--ink-muted);font-weight:500;font-size:var(--t-sm);transition:background .15s var(--ease),color .15s var(--ease)}
.nav button:hover{background:var(--surface-sunken);color:var(--ink)}
.nav button.on{background:var(--primary-soft);color:var(--primary)}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .grow{flex:1}

.main{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
.top{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-card);display:flex;align-items:center;gap:var(--s-3);padding:12px var(--s-3)}
.top h1{font-size:var(--t-lg);font-weight:600}
.search{flex:1;max-width:420px;margin-left:var(--s-3);display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;color:var(--ink-muted);font-size:var(--t-sm);background:var(--surface-sunken)}
.top .sp{flex:1}
.btn{border-radius:var(--r-md);padding:10px 16px;font-weight:600;font-size:var(--t-sm);border:1px solid var(--line);background:var(--surface);transition:transform .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{border-color:var(--ink-muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:24px;min-width:0}
.card h2{font-size:var(--t-lg);font-weight:600}
.view{display:none;flex-direction:column;gap:var(--s-3)}
.view.on{display:flex;animation:in .22s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-3)}
.kpi .row{display:flex;justify-content:space-between;align-items:center;color:var(--ink-muted);font-size:var(--t-sm);font-weight:500}
.kpi .big{font-size:var(--t-3xl);font-weight:700;letter-spacing:-.02em;margin:10px 0 2px}
.kpi .big small{font-size:var(--t-lg);color:var(--ink-muted);font-weight:500;margin-right:2px}
.kpi .sub{font-size:var(--t-sm);color:var(--ink-muted)}
.up{color:var(--income);font-weight:600}.dn{color:var(--owed);font-weight:600}
.spark{width:100%;height:44px;margin-top:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap;margin-bottom:var(--s-3)}
.legend{display:flex;gap:20px;font-size:var(--t-sm);color:var(--ink-muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.seg{display:inline-flex;background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px}
.seg button{padding:6px 14px;border-radius:var(--r-pill);font-size:var(--t-sm);color:var(--ink-muted);font-weight:500}
.seg button.on{background:var(--primary);color:#fff}
.chart{width:100%;height:280px;display:block}
.chart text{font-family:var(--font-ui);font-size:12px;fill:var(--ink-muted)}

/* settlement strip: signature */
.strip{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;gap:2px;background:var(--line)}
.strip i{display:block;height:100%}
.strip .c{background:var(--ink)}.strip .r{background:var(--recoverable)}.strip .a{background:var(--owed)}.strip .t{background:var(--primary)}
.skey{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:var(--t-xs);color:var(--ink-muted)}
.skey span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--k)}
.settle{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s-3)}
.settle .fig{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.settle .fig:last-child{border:0;font-weight:700;font-size:var(--t-base)}
.settle .fig span:first-child{color:var(--ink-muted)}

table{width:100%;border-collapse:collapse}
th{background:var(--surface-sunken);text-align:left;font-size:var(--t-sm);font-weight:500;color:var(--ink-muted);padding:14px 16px}
th:first-child{border-radius:var(--r-md) 0 0 var(--r-md)}th:last-child{border-radius:0 var(--r-md) var(--r-md) 0}
td{padding:0 16px;height:56px;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
tr:last-child td{border:0}
td.n,th.n{text-align:right}
td b{font-weight:600;font-size:var(--t-base)}
tbody tr{transition:background .15s var(--ease)}tbody tr:hover{background:var(--surface-sunken)}
.pill{display:inline-block;padding:4px 12px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:600}
.pill.paid{background:oklch(0.95 0.04 160);color:oklch(0.42 0.12 160)}
.pill.sent{background:var(--primary-soft);color:var(--primary)}
.pill.over{background:oklch(0.95 0.04 40);color:oklch(0.45 0.13 40)}
.pill.draft{background:var(--surface-sunken);color:var(--ink-muted);border:1px solid var(--line)}
.tools{display:flex;gap:10px}.tools .search{margin:0;max-width:240px}

/* editor */
.crumb{font-size:var(--t-xs);color:var(--ink-muted)}
.editor{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-card);overflow:hidden}
.form{padding:24px;display:flex;flex-direction:column;gap:var(--s-3);border-right:1px solid var(--line)}
.form h2{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.01em}
.form section{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 14px;height:56px;display:flex;flex-direction:column;justify-content:center;background:var(--surface);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field label{font-size:var(--t-xs);color:var(--ink-muted)}
.field input{border:0;outline:0;font:inherit;font-weight:500;color:var(--ink);background:none;width:100%;padding:0}
.chips{display:flex;gap:8px}
.chips button{padding:10px 16px;border-radius:var(--r-sm);background:var(--surface-sunken);color:var(--ink-muted);font-size:var(--t-sm);font-weight:500;transition:background .15s var(--ease)}
.chips button.on{background:var(--ink);color:#fff}
.li{display:grid;grid-template-columns:minmax(0,1fr) 54px 110px;gap:8px}
.li .field{height:48px;padding:6px 12px}
.linkbtn{color:var(--primary);font-weight:600;font-size:var(--t-sm);text-align:left}
.stage{background:var(--canvas);padding:32px;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.paper{background:#fff;width:100%;max-width:560px;border-radius:var(--r-lg);box-shadow:var(--sh-paper);padding:36px;font-size:12.5px;line-height:1.5}
.paper .ph{display:flex;justify-content:space-between;gap:16px}
.paper .brand{display:flex;gap:12px;align-items:center}
.paper .logo{width:40px;height:40px}
.paper h3{font-size:var(--t-xl);font-weight:700}
.paper .meta{display:grid;grid-template-columns:80px 1fr;gap:4px 12px;margin:24px 0}
.paper .meta dt{color:var(--ink-muted)}
.paper table th{background:none;border-bottom:1.5px solid var(--ink);padding:8px 0;font-size:12px;color:var(--ink);font-weight:600}
.paper table td{height:auto;padding:10px 0;font-size:12.5px;border-bottom:1px dotted var(--line)}
.paper .tot{display:flex;justify-content:space-between;border-top:1.5px solid var(--ink);margin-top:12px;padding-top:12px;font-weight:700;font-size:15px}
.paper .bank{margin-top:28px;padding-top:14px;border-top:1px dotted var(--line);color:var(--ink-muted);font-size:11.5px}
.foot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-pop)}

/* overview */
.fbar{position:sticky;top:var(--s-3);z-index:5;padding:16px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh-pop)}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.fgroup{display:flex;flex-direction:column;gap:6px}.fgroup.grow{flex:1;min-width:160px}
.field.sm{height:42px;padding:4px 12px;justify-content:center}
.frow.sum{align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line);font-size:var(--t-sm);color:var(--ink-muted)}
.frow.sum b{color:var(--ink);font-weight:600}
.sumr{display:flex;gap:16px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink)}
.tog i{width:34px;height:20px;border-radius:var(--r-pill);background:var(--line);position:relative;display:inline-block}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--sh-card);transition:left .15s var(--ease)}
.tog i.on{background:var(--primary)}.tog i.on::after{left:16px}
.asof{font-size:11px;font-weight:500;color:var(--ink-muted);background:var(--surface-sunken);border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 8px;margin-left:6px}
.kpi .row{gap:8px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--s-3)}
.g22{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-3)}
.legend i.dash{background:none;border-top:2px dashed oklch(0.75 0.08 262);border-radius:0;height:0;width:14px;vertical-align:middle}
.gstat{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.gstat span{color:var(--ink-muted)}.gstat b{font-weight:600;white-space:nowrap}
.strip.big{height:18px}.strip .x{background:oklch(0.72 0.02 260)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s-3);margin-top:20px}
.flow>div{position:relative;padding-top:12px;display:flex;flex-direction:column;gap:2px}
.flow>div i{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-pill)}
.flow b{font-size:var(--t-xl);font-weight:700;letter-spacing:-.01em}
.flow small{color:var(--ink-muted);font-size:var(--t-xs)}
.bars{display:flex;flex-direction:column;gap:16px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 170px;gap:12px;align-items:center;font-size:var(--t-sm)}
.bar .tr{height:10px;background:var(--surface-sunken);border-radius:var(--r-pill);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--primary);border-radius:var(--r-pill)}
.bar .v{text-align:right}.bar .v small{color:var(--ink-muted);font-size:var(--t-xs)}
table.compact td{height:44px;font-size:var(--t-sm)}
.sm{color:var(--ink-muted);font-size:var(--t-xs)}
@media (max-width:1100px){.g21,.g22{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{grid-template-columns:110px minmax(0,1fr) 140px}}
/* talent profile */
.phead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.phead .av{width:72px;height:72px;font-size:var(--t-xl)}
.phead h2{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.01em}
.phead .meta{color:var(--ink-muted);font-size:var(--t-sm);display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.phead .acts{margin-left:auto;display:flex;gap:10px}
.btn.warn{color:oklch(0.45 0.13 40);border-color:oklch(0.88 0.05 40)}
.btn.warn:hover{background:oklch(0.97 0.02 40);border-color:var(--owed)}
.pill.act{background:oklch(0.95 0.04 160);color:oklch(0.42 0.12 160)}
.pill.off{background:var(--surface-sunken);color:var(--ink-muted);border:1px solid var(--line)}
.pill.done{background:var(--surface-sunken);color:var(--ink-muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-8px 0 var(--s-3)}
.tabs button{padding:12px 16px;color:var(--ink-muted);font-weight:500;font-size:var(--t-sm);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--primary);border-color:var(--primary)}
.minisrip{min-width:160px}
.minisrip .strip{height:8px}
.minisrip small{display:block;color:var(--ink-muted);font-size:var(--t-xs);margin-top:6px}
.dialog{border:1px solid oklch(0.88 0.05 40);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-pop);padding:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-4)}
.dialog h2{font-size:var(--t-lg);font-weight:600;margin-bottom:4px}
.dialog p{color:var(--ink-muted);font-size:var(--t-sm)}
.dialog ul{list-style:none;padding:0;margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:var(--t-sm)}
.dialog li{position:relative;padding-left:20px}
.dialog li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--owed)}
.dialog li.ok::before{background:var(--income)}
.dialog .btnrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.dialog .btn.danger{background:var(--owed);border-color:var(--owed);color:#fff}
/* company + payout */
.logoup{display:flex;align-items:center;gap:16px;border:1px dashed var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface-sunken)}
.logoup .logo{width:56px;height:56px;font-size:var(--t-xl)}
.logoup small{display:block;color:var(--ink-muted);font-size:var(--t-xs)}
.field.cap{border-color:var(--owed)}
.field.cap label{color:var(--owed)}
.hint{font-size:var(--t-xs);color:var(--ink-muted);margin-top:-4px}
.hint b{color:var(--owed);font-weight:600}
.calc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-sunken);padding:4px 16px}
.calc .fig{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.calc .fig:last-child{border:0;font-weight:700;font-size:var(--t-base)}
.calc .fig span:first-child{color:var(--ink-muted)}
@media (max-width:1100px){.dialog{grid-template-columns:1fr}}
#dash .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}.note{margin-top:14px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-sunken);font-size:var(--t-sm);color:var(--ink-muted)}.note b{color:var(--ink)}.banner{padding:12px 16px;border-radius:var(--r-md);background:oklch(0.96 0.05 80);color:oklch(0.4 0.1 70);font-size:var(--t-sm);display:flex;justify-content:space-between;align-items:center;gap:12px}
@media (max-width:1100px){#dash .kpis,.kpis.five{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.editor{grid-template-columns:1fr}.settle{grid-template-columns:1fr}}
@media (max-width:760px){.app{grid-template-columns:1fr;padding:12px}.side{position:static;height:auto}.search{display:none}.kpis,#dash .kpis,.kpis.five{grid-template-columns:1fr}.card{overflow-x:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- prototype additions ---- */
.view{display:none}.view.on{display:flex}
select,textarea{font:inherit;color:var(--ink)}
.field select{border:0;outline:0;font:inherit;font-weight:500;background:none;width:100%;padding:0;margin-left:-3px}
.field textarea{border:0;outline:0;resize:none;width:100%;font:inherit;background:none;padding:0}
.field.ta{height:auto;min-height:84px}
.field.err{border-color:var(--owed)}
.errmsg{color:var(--owed);font-size:var(--t-xs);margin-top:-6px}
.btn.sm{padding:6px 12px;font-size:var(--t-xs)}
.btn.danger{background:var(--owed);border-color:var(--owed);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
tr[data-go]{cursor:pointer}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips button{padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);font-size:var(--t-sm);color:var(--ink-muted);font-weight:500}
.fchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:var(--s-3)}
.toolbar .search{margin:0;max-width:280px}
.toolbar .search input{border:0;outline:0;background:none;font:inherit;width:100%}
.top .search input{border:0;outline:0;background:none;font:inherit;width:100%;color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--ink-muted);font-size:var(--t-sm)}
.pill.sending{background:oklch(0.96 0.05 80);color:oklch(0.4 0.1 70)}
.pill.part{background:oklch(0.95 0.04 200);color:oklch(0.4 0.1 200)}

function invState(i){
  if(i.status==='draft')return {k:'draft',l:'Draft',c:'draft'};
  if(i.status==='sending')return {k:'sending',l:'Sending…',c:'sending'};
  if(i.status==='void')return {k:'void',l:'Void',c:'void'};
  const paid=invPaid(i),tot=invTotal(i),late=i.due<TODAY&&paid<tot;
  if(paid>=tot)return {k:'paid',l:'Paid',c:'paid'};
  if(paid>0)return {k:late?'overdue':'part',l:late?'Part-paid · Overdue':'Part-paid',c:late?'over':'part'};
  if(late)return {k:'overdue',l:'Overdue',c:'over'};
  return {k:'sent',l:'Sent',c:'sent'};
}
const campInvs=c=>S.invoices.filter(i=>i.camp===c.id);
function campMoney(c){
  const ids=campInvs(c).map(i=>i.id), pays=S.payments.filter(p=>ids.includes(p.inv));
  const income=pays.reduce((a,p)=>a+p.amt,0), commission=pays.reduce((a,p)=>a+p.comm,0);
  const ex=S.expenses.filter(e=>e.camp===c.id&&e.status==='recorded');
  let rec=0,abs=0;ex.forEach(e=>e.lines.forEach(l=>{const v=l.q*l.u;l.rec?rec+=v:abs+=v}));
  const earned=income-commission-rec;
  const pg=S.payouts.filter(p=>p.camp===c.id&&p.status==='recorded').reduce((a,p)=>a+p.gross,0);
  const net=S.payouts.filter(p=>p.camp===c.id&&p.status==='recorded').reduce((a,p)=>a+p.gross-p.ded,0);
  const ded=S.payouts.filter(p=>p.camp===c.id&&p.status==='recorded').reduce((a,p)=>a+p.ded,0);
  const invoiced=campInvs(c).filter(i=>['sent','sending'].includes(i.status)).reduce((a,i)=>a+invTotal(i),0);
  return {income,commission,rec,abs,earned,pg,net,ded,available:Math.max(0,earned-pg),over:Math.max(0,pg-earned),profit:commission-abs,invoiced,hasPay:pays.length>0};
}

}

  if(tab==='expenses'){const ex=S.expenses.filter(e=>e.talent===t.id);body=`<div class="head" style="margin-bottom:var(--s-3)"><span class="label">All expenses for this talent</span><button class="btn pri" data-go="#/expense/new?talent=${t.id}">New expense</button></div>${expTable(ex)}`}
  if(tab==='payouts'){const py=S.payouts.filter(p=>p.talent===t.id);body=`<div class="head" style="margin-bottom:var(--s-3)"><span class="label">Owed to talent ${N(m.owed)}</span><button class="btn pri" data-go="#/payout/new?talent=${t.id}">New payout</button></div>${payTable(py)}`}
  if(tab==='posts'){const ps=S.posts.filter(p=>C(p.camp).talent===t.id),lv=ps.filter(p=>p.status!=='removed'),tt=postTotals(lv);body=`<div class="stat3" style="margin-bottom:var(--s-3)"><div class="card kpi"><div class="row">Total views</div><div class="big">${short(tt.views)}</div><div class="sub">across ${new Set(lv.map(p=>p.camp)).size} campaigns</div></div><div class="card kpi"><div class="row">Engagements</div><div class="big">${short(tt.eng)}</div></div><div class="card kpi"><div class="row">Engagement rate</div><div class="big">${(tt.rate*100).toFixed(1)}%</div></div><div class="card kpi"><div class="row">Posts tracked</div><div class="big">${tt.n}</div></div></div>${reviewHtml(lv)}<div class="card">${postTable(ps,true)}</div>`}
  const accts=S.accounts.filter(a=>a.talent===t.id);

  <div class="acts"><button class="btn" data-act="talentModal" data-id="${t.id}">Edit</button>${act?`<button class="btn warn" data-act="deactModal" data-id="${t.id}">Deactivate talent</button>`:`<button class="btn pri" data-act="reactivate" data-id="${t.id}">Reactivate</button>`}</div></div></div>
  <div class="kpis five"><div class="card kpi"><div class="row">Total earned</div><div class="big"><small>₦</small>${short(m.earned)}</div><div class="sub">across ${cs.length} campaigns</div></div>
  <div class="card kpi"><div class="row">Paid out</div><div class="big"><small>₦</small>${short(m.paidOut)}</div><div class="sub">cash sent</div></div>

  <div class="card kpi"><div class="row">Active campaigns</div><div class="big">${m.active}</div><div class="sub">${cs.filter(c=>c.status==='completed').length} completed</div></div></div>

};

    S.ledger.push({id:uid('l'),talent:t.id,type:k==='advance'?'advance':k==='repay'?'cash_repayment':'write_off',amt:k==='advance'?a:-a,date:val('ad')||TODAY,reason:val('ar')});

PAGES.campaign=([id,tab],q)=>{

function invEditor(inv,q){
  if(inv&&(inv.status==='sending'||inv.status==='void'))return {title:'Invoice',nav:'invoices',html:`<div class="card empty">This invoice cannot be edited (${inv.status}).</div>`};

  const lockLines=inv&&inv.status==='sent'&&S.payments.some(p=>p.inv===inv.id);
  const ed=inv?JSON.parse(JSON.stringify(inv)):{camp:q.campaign||campsOk[0].id,billName:'',billEmail:'',billAddr:'',issue:TODAY,due:addDays(TODAY,S.company.dueDays),lines:[{d:'',q:1,p:0}],notes:'',status:'draft',log:[]};
  const prefill=()=>{const b=C(ed.camp).brand;const last=[...S.invoices].reverse().find(i=>C(i.camp).brand===b);if(last&&!inv){ed.billName=last.billName;ed.billEmail=last.billEmail;ed.billAddr=last.billAddr}};

  <div class="editor"><div class="form"><h2>${inv?'Edit '+inv.no:'Create new invoice'}</h2>
  ${inv&&inv.status==='sent'?`<div class="banner"><span>Sent invoice: bill-to, notes and dates can be corrected and resent under the same number.${lockLines?' Lines are locked because a payment exists.':''}</span></div>`:''}
  <section><div class="label">Campaign</div>${sel('Campaign'+(inv&&inv.status==='sent'?' (fixed once sent)':''),'iv_c',campsOk.map(c=>[c.id,c.title+' · '+T(c.talent).name]),ed.camp,{dis:inv&&inv.status==='sent'})}<div class="hint" id="cwarn"></div></section>
  <section><div class="label">Bill to</div>${fld('Brand name','iv_n',ed.billName)}${fld('Email','iv_e',ed.billEmail)}${fld('Address','iv_a',ed.billAddr)}</section>
  <section><div class="label">Dates</div><div class="two">${fld('Issue date','iv_i',ed.issue,{type:'date'})}${fld('Payment due date','iv_d',ed.due,{type:'date'})}</div><div class="chips">${[3,7,14,30].map(n=>`<button data-act="dueChip" data-n="${n}" class="${dd(ed.due,ed.issue)===n?'on':''}">${n} days</button>`).join('')}</div></section>
  <section><div class="label">Line items</div><div id="lines"></div>${lockLines?'':'<button class="linkbtn" data-act="addLine">+ Add line item</button>'}</section>
  <section>${fld('Notes / payment instructions','iv_t',ed.notes)}</section></div>
  <div id="pv"></div></div>
  <div class="foot">${inv&&inv.status==='sent'?`<button class="btn" data-go="#/invoice/${inv.id}">Cancel</button><button class="btn pri" data-act="saveInv" data-k="resend">Save and resend corrected copy</button>`:`<button class="btn" data-go="${inv?'#/invoice/'+inv.id:'#/invoices'}">Cancel</button><button class="btn" data-act="saveInv" data-k="draft">Save draft</button><button class="btn pri" data-act="saveInv" data-k="send">Review and send</button>`}</div>`;
  return {title:inv?'Edit invoice':'New invoice',nav:'invoices',html:html(),mount:r=>{
    window.ED=ed;ED.lock=lockLines;ED.inv=inv;
    const lines=()=>{$('#lines',r).innerHTML=ED.lines.map((l,n)=>`<div class="li" style="grid-template-columns:minmax(0,1fr) 54px 110px auto"><div class="field"><label>Description</label><input data-l="${n}" data-f="d" value="${esc(l.d)}" ${lockLines?'readonly':''}></div><div class="field"><label>Qty</label><input data-l="${n}" data-f="q" value="${l.q}" ${lockLines?'readonly':''}></div><div class="field"><label>Unit price</label><input data-l="${n}" data-f="p" value="${l.p||''}" ${lockLines?'readonly':''}></div>${!lockLines&&ED.lines.length>1?`<button class="rm" data-act="rmLine" data-n="${n}">×</button>`:'<span></span>'}</div>`).join('')};

    };
    window.pvInv=pv;lines();pv();
    r.addEventListener('input',e=>{if(e.target.closest('.form'))pv()});

function readInv(r){

ACT.sendFlow=d=>{
  const i=I(d.id),c=C(i.camp);
  if(c.status==='draft')return modal(`<h2>Cannot send yet</h2><p>${esc(c.title)} is a <b>draft</b> campaign. Move it to Active before sending invoices. The invoice is saved as a draft.</p><div class="btnrow"><button class="btn" data-act="closeModal">Close</button><button class="btn pri" data-act="activateGo" data-id="${c.id}">Activate campaign</button></div>`);

      $('#pv',r).innerHTML=paper(`${coHead(S.company,'Expense '+(e?e.no:nextNo('EXP','exp')))}<dl class="meta"><dt>Title</dt><dd>${esc(XD.title||'—')}</dd><dt>Payee</dt><dd>${esc(XD.payee||'—')}</dd><dt>Date</dt><dd>${fd(XD.date)}</dd><dt>Talent</dt><dd>${esc(T(XD.talent).name)}</dd></dl><table><thead><tr><th>Line</th><th class="n">Total (NGN)</th></tr></thead><tbody>${XD.lines.map(l=>`<tr><td>${cap(l.cat)}: ${esc(l.d||'—')} ${l.rec?pill('manual','recoverable'):''}<br><span style="color:var(--ink-muted)">${l.q} × ${N(l.u)}</span></td><td class="n">${N2(l.q*l.u)}</td></tr>`).join('')}</tbody></table><div class="tot"><span>Total</span><span>${N(tot)}</span></div>`)};window.pvX=pv;

/* ================= WHATSAPP SIMULATOR ================= */
const WA={msgs:[],step:null,flow:null,a:{},hist:[],log:[],unlisted:false,started:false};
function say(t,btns){WA.msgs.push({w:'bot',t,btns:btns||null});}
function me(t){WA.msgs.push({w:'me',t})}
function slog(t,link){WA.log.push({t,link})}
function waMenu(){WA.flow=null;WA.step='menu';WA.a={};WA.hist=[];say('Hi! What would you like to do?',['New invoice','New expense','Quick expense','Cancel'])}
function pick(list,txt,key){txt=txt.trim().toLowerCase();let n=parseInt(txt);if(n>=1&&n<=list.length)return list[n-1];return list.find(x=>key(x).toLowerCase()===txt)||list.find(x=>key(x).toLowerCase().includes(txt))}
function pdate(t){t=t.trim().toLowerCase();if(t==='today')return TODAY;if(t==='tomorrow')return addDays(TODAY,1);if(t==='yesterday')return addDays(TODAY,-1);if(/^\+\d+$/.test(t))return addDays(TODAY,+t.slice(1));if(dateIn(t))return t;const m=t.match(/^(\d{1,2})\s*([a-z]{3})/);if(m){const k=MON.findIndex(x=>x.toLowerCase()===m[2]);if(k>=0)return '2026-'+String(k+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}return null}
function ask(step){WA.hist.push(WA.step);WA.step=step;const a=WA.a;
  const talents=()=>vis().talents.filter(t=>t.status==='active');
  switch(step){
   case 'inv_talent':say('Which talent? (tap or type a name)',talents().map(t=>t.name));break;
   case 'inv_camp':{const cs=vis().campaigns.filter(c=>c.talent===a.talent&&['draft','active'].includes(c.status));if(!cs.length){say(`${T(a.talent).name} has no campaign that can be invoiced. Completed or cancelled campaigns must be reopened in the app first.`);WA.hist.pop();return waMenu()}say('Which campaign?',cs.map(c=>c.title));break}
   case 'inv_prev':{const b=C(a.camp).brand,last=[...S.invoices].reverse().find(i=>C(i.camp).brand===b);if(last){a.prev=last;say(`Bill to ${last.billName} · ${last.billEmail}?`,['Yes, use this','Edit'])}else ask('inv_name');break}
   case 'inv_name':say('Brand name to bill?');break;
   case 'inv_email':say('Billing email?');break;
   case 'inv_addr':say('Billing address? (or "skip")');break;
   case 'inv_line':say(`Line ${a.lines.length+1}: send "description, quantity, unit price"\nExample: Instagram reel, 1, 800k`);break;
   case 'inv_more':say(`Added. Total so far ${N(a.lines.reduce((s,l)=>s+l.q*l.p,0))}.`,['Add another','Done']);break;
   case 'inv_due':say('When is it due?',[`${S.company.dueDays} days`,'7 days','30 days']);break;
   case 'inv_sum':{const tot=a.lines.reduce((s,l)=>s+l.q*l.p,0);const c=C(a.camp);say(`Invoice summary\nTalent: ${T(a.talent).name}\nCampaign: ${c.title}\nBill to: ${a.name} <${a.email}>\n${a.lines.map(l=>`• ${l.d} ${l.q} × ${N(l.p)}`).join('\n')}\nTotal: ${N(tot)}\nDue: ${fd(a.due)}${campMoney(c).invoiced+tot>c.agreed?'\n⚠ Invoices now exceed the agreed amount':''}`,['Save draft','Send invoice','Cancel']);break}
   case 'inv_confirm':say(`Send ${a.no} ${N(a.total)} to ${a.email}? This emails the brand with your bank details.`,['Yes, send','No, keep draft']);break;
   case 'ex_where':say('Is this for a campaign?',['For a campaign','Talent-level (no campaign)']);break;
   case 'ex_talent':say('Which talent?',talents().map(t=>t.name));break;
   case 'ex_camp':{const cs=vis().campaigns.filter(c=>c.talent===a.talent&&['draft','active'].includes(c.status));if(!cs.length){say('No open campaign for this talent (completed and cancelled ones are refused). Try talent-level.');WA.hist.pop();return waMenu()}say('Which campaign?',cs.map(c=>c.title));break}
   case 'ex_title':say('Expense title? e.g. Shoot day 2');break;
   case 'ex_payee':say('Payee? (or "skip")');break;
   case 'ex_date':say('Date?',['Today','Yesterday']);break;
   case 'ex_cat':say('Category for line '+(a.lines.length+1)+'?',catList.map(cap));break;
   case 'ex_line':say('Send "description, quantity, unit cost"\nExample: Driver, 1, 15k');break;
   case 'ex_rec':say('Recoverable from the talent?',['Yes','No']);break;
   case 'ex_more':say(`Added. Total so far ${N(a.lines.reduce((s,l)=>s+l.q*l.u,0))}.`,['Add another','Done']);break;
   case 'ex_sum':{const tot=a.lines.reduce((s,l)=>s+l.q*l.u,0),rec=a.lines.reduce((s,l)=>s+(l.rec?l.q*l.u:0),0);say(`Expense summary\n${a.title}${a.camp?' · '+C(a.camp).title:' · talent-level'}\nTalent: ${T(a.talent).name}\n${a.lines.map(l=>`• ${cap(l.cat)}: ${l.d} ${l.q} × ${N(l.u)}${l.rec?' (recoverable)':''}`).join('\n')}\nTotal ${N(tot)} · recoverable ${N(rec)}${!a.camp&&rec?`\nThis will be added to ${T(a.talent).name}'s advance balance.`:''}`,['Save','Cancel']);break}
   case 'q_camp':say('Quick expense. Which campaign?',vis().campaigns.filter(c=>c.status==='active').map(c=>c.title));break;
   case 'q_cat':say('Category?',catList.map(cap));break;
   case 'q_line':say('Send "description, amount"\nExample: Driver, 15k');break;
  }
}
function waHandle(txt){
  const t=txt.trim(),lc=t.toLowerCase(),a=WA.a;
  if(lc==='menu'||lc==='cancel'||lc==='cancel '){if(WA.step!=='menu'&&lc==='cancel')say('Cancelled. Nothing was saved.');return waMenu()}
  if(lc==='help'){say('Commands: menu, back, cancel. Amounts like 800k or 1.5m. Dates like today, +14 or 23 Nov.');return}
  if(lc==='back'){const p=WA.hist.pop();if(p&&p!=='menu'){WA.hist.pop();ask(p)}else waMenu();return}
  const bad_=(m)=>say(m);
  switch(WA.step){
   case 'menu':{const k=lc;
     if(k.includes('quick')||k==='3'){WA.flow='quick';a.lines=[];return ask('q_camp')}
     if(k.includes('invoice')||k==='1'){WA.flow='invoice';a.lines=[];return ask('inv_talent')}
     if(k.includes('expense')||k==='2'){WA.flow='expense';a.lines=[];return ask('ex_where')}
     return bad_('Please choose: New invoice, New expense or Quick expense.')}
   case 'inv_talent':{const x=pick(vis().talents.filter(t=>t.status==='active'),t,t=>t.name);if(!x)return bad_('I could not find that talent. Pick one of the options.');a.talent=x.id;return ask('inv_camp')}
   case 'inv_camp':{const x=pick(vis().campaigns.filter(c=>c.talent===a.talent&&['draft','active'].includes(c.status)),t,c=>c.title);if(!x)return bad_('Pick one of the campaigns.');a.camp=x.id;return ask('inv_prev')}
   case 'inv_prev':if(lc.startsWith('yes')){a.name=a.prev.billName;a.email=a.prev.billEmail;a.addr=a.prev.billAddr;return ask('inv_line')}return ask('inv_name');
   case 'inv_name':if(!t)return;a.name=t;return ask('inv_email');
   case 'inv_email':if(!emailOk(t))return bad_('That does not look like an email. Example: billing@brand.com');a.email=t;return ask('inv_addr');
   case 'inv_addr':a.addr=lc==='skip'?'':t;return ask('inv_line');
   case 'inv_line':{const p=t.split(',').map(s=>s.trim());if(p.length!==3)return bad_('Use: description, quantity, unit price\nExample: Instagram reel, 1, 800k');const q=parseFloat(p[1]),pr=parseAmt(p[2]);if(!p[0]||!(q>0)||!(pr>0))return bad_('Quantity and price must be above zero. Example: Instagram reel, 1, 800k');if(a.lines.length>=15)return bad_('Maximum 15 lines.');a.lines.push({d:p[0],q,p:pr});return ask('inv_more')}
   case 'inv_more':if(lc.startsWith('add'))return ask('inv_line');return ask('inv_due');
   case 'inv_due':{let d;const m=lc.match(/^(\d+)\s*days?$/);d=m?addDays(TODAY,+m[1]):pdate(t);if(!d||d<TODAY)return bad_('Send a number of days (e.g. 14) or a date like 23 Nov.');a.due=d;return ask('inv_sum')}
   case 'inv_sum':{
     if(lc.startsWith('save')||lc.startsWith('send')){
       const c=C(a.camp);if(lc.startsWith('send')&&c.status==='draft'){say('That campaign is still a draft, so the invoice can be saved but not sent. Saving as a draft.');}
       const tot=a.lines.reduce((s,l)=>s+l.q*l.p,0);
       const inv={id:uid('i'),no:nextNo('INV','inv'),camp:a.camp,status:'draft',billName:a.name,billEmail:a.email,billAddr:a.addr,issue:TODAY,due:a.due,lines:a.lines,notes:'',sentAt:'',log:[],delivery:'',source:'whatsapp',snap:null};
       S.counters.inv++;S.invoices.push(inv);save();slog(`Created draft ${inv.no} (${N(tot)}) from WhatsApp`,'#/invoice/'+inv.id);
       if(lc.startsWith('send')&&c.status!=='draft'){a.no=inv.no;a.total=tot;a.id=inv.id;return ask('inv_confirm')}
       say(`Saved ${inv.no} as a draft. Open it in the app to review or send:\napp.example/invoices/${inv.no}`);return waMenu()}
     return bad_('Choose Save draft, Send invoice or Cancel.')}
   case 'inv_confirm':{const inv=I(a.id);if(lc.startsWith('yes')){say('Sending…');doSendQuiet(inv);say(`Sent ${inv.no} to ${inv.email||inv.billEmail}. PDF attached 📎 (simulated).`);slog(`Sent ${inv.no} to ${inv.billEmail} after second confirmation`,'#/invoice/'+inv.id)}else say(`Kept ${inv.no} as a draft.`);return waMenu()}
   case 'ex_where':if(lc.startsWith('for')||lc==='1'){a.scope='camp';return ask('ex_talent')}if(lc.startsWith('talent')||lc==='2'){a.scope='talent';return ask('ex_talent')}return bad_('Choose For a campaign or Talent-level.');
   case 'ex_talent':{const x=pick(vis().talents.filter(t=>t.status==='active'),t,t=>t.name);if(!x)return bad_('I could not find that talent.');a.talent=x.id;return a.scope==='camp'?ask('ex_camp'):ask('ex_title')}
   case 'ex_camp':{const x=pick(vis().campaigns.filter(c=>c.talent===a.talent&&['draft','active'].includes(c.status)),t,c=>c.title);if(!x)return bad_('Pick one of the campaigns.');a.camp=x.id;return ask('ex_title')}
   case 'ex_title':if(!t)return;a.title=t;return ask('ex_payee');
   case 'ex_payee':a.payee=lc==='skip'?'':t;return ask('ex_date');
   case 'ex_date':{const d=pdate(t);if(!d)return bad_('Try: today, yesterday, +0 or 23 Nov.');a.date=d;return ask('ex_cat')}
   case 'ex_cat':{const x=pick(catList,t,x=>x);if(!x)return bad_('Pick one of the categories.');a.cat=x;return ask('ex_line')}
   case 'ex_line':{const p=t.split(',').map(s=>s.trim());if(p.length!==3)return bad_('Use: description, quantity, unit cost\nExample: Driver, 1, 15k');const q=parseFloat(p[1]),u=parseAmt(p[2]);if(!p[0]||!(q>0)||!(u>0))return bad_('Quantity and cost must be above zero.');a.cur={cat:a.cat,d:p[0],q,u};return ask('ex_rec')}
   case 'ex_rec':a.cur.rec=lc.startsWith('y');a.lines.push(a.cur);return ask('ex_more');
   case 'ex_more':if(lc.startsWith('add'))return ask('ex_cat');return ask('ex_sum');
   case 'ex_sum':if(lc.startsWith('save'))return saveWaExpense({camp:a.camp||null,talent:a.talent,title:a.title,payee:a.payee,date:a.date,lines:a.lines});return bad_('Choose Save or Cancel.');
   case 'q_camp':{const x=pick(vis().campaigns.filter(c=>c.status==='active'),t,c=>c.title);if(!x)return bad_('Pick one of the campaigns.');a.camp=x.id;a.talent=x.talent;return ask('q_cat')}
   case 'q_cat':{const x=pick(catList,t,x=>x);if(!x)return bad_('Pick a category.');a.cat=x;return ask('q_line')}
   case 'q_line':{const p=t.split(',').map(s=>s.trim());const am=parseAmt(p[1]);if(p.length!==2||!p[0]||!(am>0))return bad_('Use: description, amount\nExample: Driver, 15k');a.cur={cat:a.cat,d:p[0],q:1,u:am};return ask('ex_rec')}
  }
}
function saveWaExpense(o){const e={id:uid('e'),no:nextNo('EXP','exp'),...o,status:'recorded',source:'whatsapp'};S.counters.exp++;S.expenses.push(e);
  if(!e.camp){const rec=e.lines.reduce((s,l)=>s+(l.rec?l.q*l.u:0),0);if(rec)S.ledger.push({id:uid('l'),talent:e.talent,type:'advance',amt:rec,date:TODAY,reason:'From expense '+e.no,expense:e.id})}
  save();slog(`Created ${e.no} (${N(expTotal(e))}) from WhatsApp`,'#/expense/'+e.id);say(`Saved ${e.no} · ${N(expTotal(e))}. Open: app.example/expenses/${e.no}`);waMenu()}
function doSendQuiet(inv){inv.status='sent';inv.sentAt=TODAY;inv.snap=JSON.parse(JSON.stringify(S.company));inv.log.push({t:TODAY,kind:'Sent (via WhatsApp)',to:inv.billEmail});inv.delivery='delivered';save()}
PAGES.whatsapp=()=>{
  if(!WA.started){WA.started=true;waMenu()}
  return {title:'WhatsApp assistant',nav:'whatsapp',html:`<div class="wa"><div><div class="phone"><div class="chathead"><div class="logo">T</div><div><b>Talent Manager</b><br><small style="color:#8696a0">Business account · ${esc(WA.unlisted?'+234 700 000 0000':S.company.wa[0]||'no number')}</small></div></div><div class="chat" id="chat"></div><div class="chatin"><input id="cin" placeholder="Type a message"><button id="csend" aria-label="Send">➤</button></div></div>
  <div class="demo" style="margin-top:12px">Simulated chat. Try: <b>New invoice</b>, <b>New expense</b> or <b>Quick expense</b>. Type <b>back</b>, <b>cancel</b> or <b>menu</b> at any step. Amounts like <b>800k</b>.</div></div>
  <div style="display:flex;flex-direction:column;gap:var(--s-3)"><div class="card"><h2 style="margin-bottom:8px">How it works</h2><p class="sm" style="font-size:var(--t-sm)">The assistant only talks to allowlisted numbers, asks one thing at a time, and creates nothing until the final confirmation. Sending an invoice needs a second confirmation that repeats the recipient email.</p><label class="check" style="margin-top:14px"><input type="checkbox" id="unl" ${WA.unlisted?'checked':''}>Pretend to message from a number that is <b>not</b> on the allowlist</label><div style="margin-top:12px"><button class="btn" data-act="waReset">Restart conversation</button></div></div>
  <div class="card"><h2 style="margin-bottom:8px">What the server did</h2><div class="slog" id="slog"></div></div></div></div>`,mount:r=>{
    const draw=()=>{const ch=$('#chat',r);ch.innerHTML=WA.msgs.map((m,k)=>m.w==='me'?`<div class="bub me">${esc(m.t)}</div>`:`<div class="bub bot">${esc(m.t)}</div>${m.btns&&k===WA.msgs.length-1?`<div class="qr">${m.btns.map(b=>`<button data-act="waBtn" data-v="${esc(b)}">${esc(b)}</button>`).join('')}</div>`:''}`).join('');ch.scrollTop=ch.scrollHeight;
      $('#slog',r).innerHTML=WA.log.map(l=>`<div>${esc(l.t)} ${l.link?`<a class="link" data-go="${l.link}">Open</a>`:''}</div>`).join('')||'<div class="sm">Nothing created yet.</div>'};
    window.waDraw=draw;draw();
    const send=()=>{const i=$('#cin',r),v=i.value.trim();if(!v)return;i.value='';waUser(v)};
    $('#csend',r).onclick=send;$('#cin',r).onkeydown=e=>{if(e.key==='Enter')send()};
    $('#unl',r).onchange=e=>{WA.unlisted=e.target.checked;render(true)};
  }};
};
function waUser(v){
  me(v);
  if(WA.unlisted){slog(`Ignored a message from an unlisted number: "${v.slice(0,30)}". No reply, logged.`);waDraw();return}
  waHandleQ(v);waDraw();
}
// route quick-flow recoverable step through the shared handler
function waHandleQ(v){
  if(WA.flow==='quick'&&WA.step==='ex_rec'){const lc=v.toLowerCase();const a=WA.a;if(lc.startsWith('y')||lc.startsWith('n')){a.cur.rec=lc.startsWith('y');return saveWaExpense({camp:a.camp,talent:a.talent,title:a.cur.d,payee:'',date:TODAY,lines:[a.cur]})}}
  waHandle(v);
}
ACT.waBtn=d=>{waUser(d.v)};
ACT.waReset=()=>{WA.msgs=[];WA.log=[];WA.started=false;render(true)};

function md(s){
  const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/(https?:\/\/[^\s<]+)/g,'<a class="link" href="$1" target="_blank" rel="noopener">$1</a>');
  let out='',inList=false;
  esc(s||'').split('\n').forEach(l=>{
    const li=l.match(/^\s*[-*]\s+(.*)/),h=l.match(/^#{1,3}\s+(.*)/);
    if(li){if(!inList){out+='<ul>';inList=true}out+='<li>'+inl(li[1])+'</li>';return}
    if(inList){out+='</ul>';inList=false}
    if(h)out+='<h4>'+inl(h[1])+'</h4>';else if(l.trim())out+='<p>'+inl(l)+'</p>';
  });
  return out+(inList?'</ul>':'');
}

    <div style="margin-top:8px">${L('#/campaign/'+c.id+'/tasks','All tasks')}</div></div>
    <div><div class="label">Latest notes</div><div style="margin-top:10px">${ns.map(n=>`<div class="fig" style="display:flex;justify-content:space-between;gap:12px;padding:5px 0"><span>${esc(n.title)}</span><span>${fds(n.date)}</span></div>`).join('')||'<span class="sm">No notes yet.</span>'}</div>
    <div style="margin-top:8px">${L('#/campaign/'+c.id+'/notes','All notes')}</div></div></div>`;
}

/* ---------- team + access (simple RBAC for the prototype) ---------- */
const PAGE_LIST=[['overview','Overview'],['talents','Talents'],['campaigns','Campaigns'],['invoices','Invoices'],['expenses','Expenses'],['advances','Advances'],['payouts','Payouts'],['insights','Insights'],['tasks','Tasks'],['whatsapp','WhatsApp']];
const ROUTE_PAGE={overview:'overview',talents:'talents',talent:'talents',campaigns:'campaigns',campaign:'campaigns',invoices:'invoices',invoice:'invoices',expenses:'expenses',expense:'expenses',advances:'advances',payouts:'payouts',payout:'payouts',insights:'insights',tasks:'tasks',whatsapp:'whatsapp',company:'@admin',team:'@admin'};
const CAMP_TAB_PAGE={overview:'campaigns',notes:'campaigns',edit:'campaigns',expenses:'expenses',invoices:'invoices',payouts:'payouts',posts:'insights',tasks:'tasks'};
const TALENT_TAB_PAGE={campaigns:'talents',advances:'advances',expenses:'expenses',payouts:'payouts',posts:'insights'};
const PRESETS={'Finance':['overview','invoices','expenses','advances','payouts'],'Account manager':['talents','campaigns','tasks','insights','expenses'],'Operations':['campaigns','tasks','expenses','invoices']};
const meU=()=>S.team.find(u=>u.id===S.me&&u.status==='active')||S.team.find(u=>u.role==='admin'&&u.status==='active')||S.team[0];
const isAdm=()=>meU().role==='admin';
const can=pg=>isAdm()||(pg!=='@admin'&&(meU().pages||[]).includes(pg));
const seesT=id=>isAdm()||(meU().talents||[]).includes(id);
const activeAdmins=()=>S.team.filter(u=>u.role==='admin'&&u.status==='active');
const firstPage=()=>{const f=PAGE_LIST.find(([k])=>can(k));return f?f[0]:null};
/* the scoped view of the data for the signed-in user: talent scope plus page ownership */
function vis(){
  const u=meU();if(u.role==='admin')return S;
  const A=pg=>(u.pages||[]).includes(pg);
  const tl=S.talents.filter(t=>(u.talents||[]).includes(t.id)),ti=new Set(tl.map(t=>t.id));
  const cs=S.campaigns.filter(c=>ti.has(c.talent)),ci=new Set(cs.map(c=>c.id));
  const inv=A('invoices')?S.invoices.filter(i=>ci.has(i.camp)):[],ii=new Set(inv.map(i=>i.id));
  return {...S,talents:tl,campaigns:cs,invoices:inv,payments:S.payments.filter(p=>ii.has(p.inv)),
    expenses:A('expenses')?S.expenses.filter(e=>ti.has(e.talent)):[],ledger:A('advances')?S.ledger.filter(l=>ti.has(l.talent)):[],
    payouts:A('payouts')?S.payouts.filter(p=>ti.has(p.talent)):[],posts:A('insights')?S.posts.filter(p=>ci.has(p.camp)):[],
    accounts:A('insights')?S.accounts.filter(a=>ti.has(a.talent)):[],tasks:A('tasks')?S.tasks.filter(t=>ci.has(t.camp)):[],
    notes:A('campaigns')?S.notes.filter(n=>ci.has(n.camp)):[]};
}
function ensureTalent(){if(!seesT(LAST_T)){const f=vis().talents[0];if(f)LAST_T=f.id}}
function applyAccess(){
  $$('.nav button[data-nav]').forEach(b=>{const k=b.dataset.nav;b.style.display=can(k==='company'||k==='team'?'@admin':k)?'':'none'});
  $$('.nav').forEach(nav=>{let lab=null,any=false;const flush=()=>{if(lab)lab.style.display=any?'':'none'};
    [...nav.children].forEach(el=>{if(el.classList.contains('label')){flush();lab=el;any=false}else if(el.matches('button[data-nav]')&&el.style.display!=='none')any=true});flush()});
  const mp={Campaign:'campaigns',Invoice:'invoices',Expense:'expenses',Payout:'payouts',Advance:'advances',Talent:'@admin',Task:'tasks'};
  $$('#crMenu button').forEach(b=>{const pg=mp[b.textContent.trim()];if(pg)b.style.display=can(pg)?'':'none'});
  const u=meU();$('#vaBtn').textContent='Viewing as '+u.name.split(' ')[0]+' ▾';
}
$('#vaBtn').onclick=e=>{e.stopPropagation();const m=$('#vaMenu');
  m.innerHTML='<div class="sm" style="padding:6px 12px 8px">Demo: switch person to see what they can access</div>'+S.team.filter(u=>u.status==='active').map(u=>`<button data-act="viewAs" data-id="${u.id}">${esc(u.name)}<small>${u.role==='admin'?'Admin':'Member'}</small></button>`).join('');
  m.classList.toggle('on')};
ACT.viewAs=d=>{S.me=d.id;save();ensureTalent();toast('Now viewing as '+meU().name);const f=firstPage();location.hash=can('overview')?'#/overview':(f?'#/'+f:'#/overview');render()};
function accessBanner(p0){
  const u=meU();if(u.role==='admin')return '';
  const adm=activeAdmins()[0];
  return `<div class="banner"><span><b>Demo: viewing as ${esc(u.name)}</b> (Member). Pages: ${(u.pages||[]).map(k=>cap(k)).join(', ')||'none'}. Talents: ${(u.talents||[]).length} assigned.${p0==='overview'?' Overview figures on this page are sample company-wide data; the real app totals only your talents.':''}</span><button class="btn sm" data-act="viewAs" data-id="${adm?adm.id:'m1'}">Back to admin</button></div>`;
}
PAGES.noaccess=()=>{const f=firstPage();return {title:'No access',nav:'',html:`<div class="card"><div class="empty"><b>You don't have access to this page.</b><br>${f?'Ask an admin if you need it.':'Ask an admin for access.'}${f?`<br><br><button class="btn pri" data-go="#/${f}">Go to ${cap(f)}</button>`:''}</div></div>`}};

/* ---------- Team page (admin) ---------- */
PAGES.team=()=>{
  const open=u=>S.tasks.filter(t=>t.assignee===u.id&&t.status!=='done').length;
  const rows=S.team.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="sm">${esc(u.email||'—')}</span></td>
    <td>${pill(u.role==='admin'?'act':'draft',u.role==='admin'?'Admin':'Member')}</td>
    <td>${u.status==='active'?pill('act','Active'):u.status==='invited'?pill('sending','Invited'):pill('void','Deactivated')}</td>
    <td>${u.role==='admin'?'All pages':(u.pages||[]).length+' of '+PAGE_LIST.length+'<br><span class="sm">'+esc((u.pages||[]).map(cap).join(', '))+'</span>'}</td>
    <td>${u.role==='admin'?'All talents':(u.talents||[]).length+' of '+S.talents.length+'<br><span class="sm">'+esc((u.talents||[]).map(id=>(T(id)||{}).name).filter(Boolean).join(', '))+'</span>'}</td>
    <td class="n"><div class="acts" style="justify-content:flex-end">
      <button class="btn sm" data-act="tmEdit" data-id="${u.id}">Edit</button>
      ${u.status==='invited'?`<button class="btn sm" data-act="tmAccept" data-id="${u.id}">Accept (demo)</button><button class="btn sm" data-act="tmResend" data-id="${u.id}">Resend</button><button class="btn sm" data-act="tmRevoke" data-id="${u.id}">Revoke</button>`:''}
      ${u.status==='active'?`<button class="btn sm" data-act="tmDeact" data-id="${u.id}">Deactivate</button>`:''}
      ${u.status==='deactivated'?`<button class="btn sm" data-act="tmReact" data-id="${u.id}">Reactivate</button>`:''}</div>${open(u)&&u.status!=='invited'?`<div class="sm" style="text-align:right;margin-top:4px">${open(u)} open task${open(u)>1?'s':''}</div>`:''}</td></tr>`).join('');
  return {title:'Team',nav:'team',html:`<div class="card"><div class="ph2"><div><h2>Team</h2><div class="sm" style="margin-top:6px">Invite colleagues, choose the pages they can open and the talents they can see. Admins see everything and manage the team.</div></div><div class="acts"><button class="btn pri" data-act="tmNew">Invite member</button></div></div></div>
  <div class="card"><table><thead><tr><th>Person</th><th>Role</th><th>Status</th><th>Pages</th><th>Talents</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="note"><b>Prototype note:</b> invite emails are simulated. Use <b>Accept (demo)</b> to activate an invited person, then <b>Viewing as</b> in the top bar to see what they can access.</div>`};
};
function teamForm(u){
  const isNew=!u;u=u||{name:'',email:'',role:'member',pages:['campaigns','tasks'],talents:[]};
  const chk=(att,k,l,on)=>`<label class="check"><input type="checkbox" ${att}="${k}" ${on?'checked':''}>${esc(l)}</label>`;
  modal(`<h2>${isNew?'Invite member':'Edit member'}</h2>
    <div class="two">${fld('Name','tm_n',u.name)}${fld('Email','tm_e',u.email,{ro:!isNew,type:'email'})}</div>
    ${sel('Role','tm_r',[['member','Member: only the pages and talents ticked below'],['admin','Admin: everything, manages the team']],u.role)}
    <div id="tm_acc" style="display:${u.role==='admin'?'none':'flex'};flex-direction:column;gap:14px">
      <div><div class="label" style="margin-bottom:8px">Pages <span class="sm">· quick fill:</span> ${Object.keys(PRESETS).map(p=>`<button class="btn sm" data-act="tmPreset" data-v="${p}">${p}</button>`).join(' ')}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${PAGE_LIST.map(([k,l])=>chk('data-pg',k,l,(u.pages||[]).includes(k))).join('')}</div></div>
      <div><div class="label" style="margin-bottom:8px">Talents they can see <button class="btn sm" data-act="tmAllT">Select all</button></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${S.talents.map(t=>chk('data-tl',t.id,t.name,(u.talents||[]).includes(t.id))).join('')}</div></div>
      <p class="sm">Company settings and Team are admin-only. A ticked page gives full use of that page, for the ticked talents only.</p></div>
    ${isNew?'<p class="sm">They get an email with a link (valid 7 days, single use) to set a password.</p>':''}
    <div class="btnrow"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" id="tm_ok">${isNew?'Send invite':'Save changes'}</button></div>`,
    {wide:true,mount:m=>{
      $('#tm_r',m).onchange=e=>{$('#tm_acc',m).style.display=e.target.value==='admin'?'none':'flex'};
      $('#tm_ok',m).onclick=()=>{
        const nm=val('tm_n'),em=val('tm_e').toLowerCase(),role=val('tm_r');
        if(!nm)return bad('tm_n','Name is required');
        if(!emailOk(em))return bad('tm_e','Enter a valid email');
        if(isNew&&S.team.some(x=>(x.email||'').toLowerCase()===em))return bad('tm_e','Already on the team');
        if(!isNew&&u.role==='admin'&&role!=='admin'&&activeAdmins().length===1&&u.status==='active')return bad('tm_r','There must be at least one active admin');
        const pages=$$('[data-pg]',m).filter(x=>x.checked).map(x=>x.dataset.pg),talents=$$('[data-tl]',m).filter(x=>x.checked).map(x=>x.dataset.tl);
        if(role==='member'&&!pages.length)return toast('Tick at least one page, or the member sees nothing',true);
        const o={name:nm,email:em,role,pages:role==='admin'?[]:pages,talents:role==='admin'?[]:talents};
        if(isNew)S.team.push({id:uid('m'),...o,status:'invited',invitedBy:S.me});else Object.assign(u,o);
        save();closeModal();toast(isNew?'Invite sent to '+em+' (simulated)':'Changes saved');render(true);applyAccess()}}});
}
ACT.tmNew=()=>teamForm(null);
ACT.tmEdit=d=>teamForm(S.team.find(x=>x.id===d.id));
ACT.tmPreset=d=>{const m=$('.modal');$$('[data-pg]',m).forEach(x=>x.checked=PRESETS[d.v].includes(x.dataset.pg))};
ACT.tmAllT=()=>{const m=$('.modal');const b=$$('[data-tl]',m);const all=b.every(x=>x.checked);b.forEach(x=>x.checked=!all)};
ACT.tmAccept=d=>{const u=S.team.find(x=>x.id===d.id);u.status='active';save();toast(u.name+' accepted the invite (demo). Use Viewing as to see their access.');render(true)};
ACT.tmResend=d=>{toast('A new invite link was sent. The old link no longer works (simulated).')};
ACT.tmRevoke=d=>confirmBox('Revoke this invite?','<p>The link stops working and the person is removed from the list.</p>','Revoke',()=>{S.team=S.team.filter(x=>x.id!==d.id);save();toast('Invite revoked');render(true)},true);
ACT.tmDeact=d=>{const u=S.team.find(x=>x.id===d.id);
  if(u.role==='admin'&&activeAdmins().length===1)return toast('There must be at least one active admin',true);
  const n=S.tasks.filter(t=>t.assignee===u.id&&t.status!=='done').length;
  confirmBox('Deactivate '+esc(u.name)+'?','<p>They are signed out immediately and cannot sign in. Their name stays on the records they created.'+(n?` <b>${n} open task${n>1?'s':''}</b> assigned to them will need reassigning.`:'')+'</p>','Deactivate',()=>{u.status='deactivated';if(S.me===u.id)S.me=activeAdmins()[0].id;save();toast(u.name+' deactivated');render(true);applyAccess()},true)};
ACT.tmReact=d=>{const u=S.team.find(x=>x.id===d.id);u.status='invited';save();toast('A fresh invite was sent; they set a new password (simulated).');render(true)};

if(!location.hash)location.hash='#/overview';
render();
</script></body></html>
